name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-latest'
            artifact-glob: 'src-tauri/target/release/bundle/{deb,rpm,appimage}/*'
          - platform: 'windows-latest'
            artifact-glob: 'src-tauri/target/release/bundle/{msi,nsis}/*'
          - platform: 'macos-latest'
            artifact-glob: 'src-tauri/target/release/bundle/{dmg,macos}/*'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install frontend dependencies
        run: npm ci

      - name: build helper daemon
        # No-op on non-macOS (see scripts/build-helper.sh). reroute's build.rs
        # validates its bundle.resources path even for plain `cargo` builds,
        # so this has to run before any cargo command below, matching what
        # beforeBuildCommand does for `tauri build`.
        run: bash scripts/build-helper.sh

      - name: cargo clippy
        # helper is a Unix-only privileged daemon (unix sockets, getpeereid)
        # that isn't meant to build on Windows at all, and isn't part of any
        # shipped Linux feature yet either — exclude it outside macOS so
        # `--workspace` doesn't try to compile it there.
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            cargo clippy --workspace --all-targets
          else
            cargo clippy --workspace --all-targets --exclude helper
          fi

      - name: cargo test
        # helper's admin-group test needs to run as an actual admin user
        # (see CLAUDE.md); everything else is safe on a stock CI runner.
        run: cargo test -p reroute -p helper-protocol

      - name: typecheck + frontend build
        run: npm run build

      - name: tauri build
        # Unsigned CI build — just proves the app compiles and bundles on
        # this OS. Real signing/notarization stays in release-macos.yml.
        # createUpdaterArtifacts is disabled here since signing those needs
        # TAURI_SIGNING_PRIVATE_KEY, which only the release workflow has.
        shell: bash
        run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: reroute-${{ matrix.platform }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: warn
          retention-days: 7
